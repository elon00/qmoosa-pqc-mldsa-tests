name: Full-Spectrum Post-Quantum Reality Gates & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-mldsa-tests

      - name: Checkout protocol repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mldsa-protocol
          ref: af247a026216d8465c52c5793a0e16d72614ba33
          path: qmoosa-pqc-mldsa-protocol

      - name: Checkout engine repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mldsa-engine
          ref: 4d8bc2119b779253a6beaf061df245713c1bc4bf
          path: qmoosa-pqc-mldsa-engine

      - name: Checkout sdk repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mldsa-sdk
          ref: f5638ae70a78e87060d2e277f34e6f9ddeffe80c
          path: qmoosa-pqc-mldsa-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies in sibling repositories
        run: |
          npm install --prefix qmoosa-pqc-mldsa-protocol
          npm install --prefix qmoosa-pqc-mldsa-engine
          npm install --prefix qmoosa-pqc-mldsa-sdk

      - name: Install dependencies in tests repository
        working-directory: qmoosa-pqc-mldsa-tests
        run: |
          rm -f package-lock.json
          npm install --no-package-lock
          mkdir -p node_modules/@qmoosa/pqc-mldsa-protocol
          mkdir -p node_modules/@qmoosa/pqc-mldsa-engine
          mkdir -p node_modules/@qmoosa/pqc-mldsa-sdk
          tar -xzf packages/qmoosa-pqc-mldsa-protocol-1.0.0.tgz -C node_modules/@qmoosa/pqc-mldsa-protocol --strip-components=1
          tar -xzf packages/qmoosa-pqc-mldsa-engine-1.0.0.tgz -C node_modules/@qmoosa/pqc-mldsa-engine --strip-components=1
          tar -xzf packages/qmoosa-pqc-mldsa-sdk-1.0.0.tgz -C node_modules/@qmoosa/pqc-mldsa-sdk --strip-components=1

      - name: Run Source & Package Integrity Gate (Archive Mode)
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run verify:archive

      - name: Run Strict Current-HEAD Alignment Gate
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run verify:current-head

      - name: Run Hermetic Source Derivation & Canonical Artifact Comparison Gate
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run verify:source

      - name: Run Integration Tests
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run test:integration

      - name: Run Adversarial Negative Control Suite
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run test:negative

      - name: Static Lint Check
        working-directory: qmoosa-pqc-mldsa-tests
        run: npm run lint
